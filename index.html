<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>palukku · Stats</title>
  <meta name="description" content="Public GitHub stats for palukku, updated live.">
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1b1f24;
      --muted: #5d6673;
      --border: #e1e4e8;
      --accent: #2f6feb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --card: #161b22;
        --text: #e6edf3;
        --muted: #8b949e;
        --border: #30363d;
        --accent: #58a6ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 860px; margin: 0 auto; padding: 48px 16px; }
    header { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }
    header img { width: 72px; height: 72px; border-radius: 50%; border: 1px solid var(--border); }
    h1 { margin: 0; font-size: 1.6rem; }
    h2 { font-size: 1rem; color: var(--muted); font-weight: 600; margin: 32px 0 12px; }
    a { color: var(--accent); }
    .profile-link {
      margin-left: auto;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      text-decoration: none;
      font-weight: 600;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
    .stat .value { font-size: 1.8rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .stat .label { color: var(--muted); font-size: 0.875rem; }
    .list { background: var(--card); border: 1px solid var(--border); border-radius: 10px; margin: 0; padding: 0; list-style: none; }
    .list li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--border); }
    .list li:first-child { border-top: 0; }
    .list .meta { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .list a { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar { height: 6px; border-radius: 3px; background: var(--accent); margin-top: 4px; }
    .lang { display: block; padding: 10px 16px; }
    footer { margin-top: 40px; color: var(--muted); font-size: 0.875rem; }
    .error { color: #d73a49; }
  </style>
</head>
<body>
  <main>
    <header>
      <img id="avatar" alt="" src="https://github.com/palukku.png?size=144">
      <div>
        <h1 id="name">palukku</h1>
        <div id="bio" style="color: var(--muted)"></div>
      </div>
      <a class="profile-link" href="https://github.com/palukku" rel="noopener">GitHub profile →</a>
    </header>

    <h2>Overview</h2>
    <div class="grid">
      <div class="stat"><div class="value" id="s-repos">–</div><div class="label">Public repos</div></div>
      <div class="stat"><div class="value" id="s-stars">–</div><div class="label">Stars received</div></div>
      <div class="stat"><div class="value" id="s-forks">–</div><div class="label">Forks received</div></div>
      <div class="stat"><div class="value" id="s-followers">–</div><div class="label">Followers</div></div>
      <div class="stat"><div class="value" id="s-following">–</div><div class="label">Following</div></div>
      <div class="stat"><div class="value" id="s-gists">–</div><div class="label">Public gists</div></div>
    </div>

    <h2>Languages (by repo)</h2>
    <ul class="list" id="languages"><li>Loading…</li></ul>

    <h2>Recently updated repos</h2>
    <ul class="list" id="recent"><li>Loading…</li></ul>

    <footer>
      Live data from the GitHub API · refreshes automatically every 5 minutes ·
      <span id="updated">not loaded yet</span>
    </footer>
  </main>

  <script>
    const USER = "palukku";
    const API = "https://api.github.com";
    const REFRESH_MS = 5 * 60 * 1000;

    const $ = (id) => document.getElementById(id);
    const fmt = new Intl.NumberFormat("en-US");

    async function getJSON(url) {
      const res = await fetch(url, { headers: { Accept: "application/vnd.github+json" } });
      if (!res.ok) throw new Error(`GitHub API responded with ${res.status}`);
      return res.json();
    }

    async function getAllRepos() {
      const repos = [];
      for (let page = 1; ; page++) {
        const batch = await getJSON(`${API}/users/${USER}/repos?per_page=100&page=${page}&sort=pushed`);
        repos.push(...batch);
        if (batch.length < 100) return repos;
      }
    }

    function el(tag, props = {}, ...children) {
      const node = Object.assign(document.createElement(tag), props);
      node.append(...children);
      return node;
    }

    function renderLanguages(repos) {
      const counts = {};
      for (const r of repos) if (r.language) counts[r.language] = (counts[r.language] || 0) + 1;
      const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 8);
      const list = $("languages");
      if (!entries.length) { list.replaceChildren(el("li", { textContent: "No data" })); return; }
      const max = entries[0][1];
      list.replaceChildren(...entries.map(([lang, n]) => {
        const row = el("li", { className: "lang" });
        const top = el("div", { style: "display:flex;justify-content:space-between" },
          el("span", { textContent: lang }),
          el("span", { className: "meta", textContent: `${n} ${n === 1 ? "repo" : "repos"}` }));
        const bar = el("div", { className: "bar", style: `width:${(n / max) * 100}%` });
        row.append(top, bar);
        return row;
      }));
    }

    function renderRecent(repos) {
      const list = $("recent");
      const recent = repos.filter((r) => !r.fork).slice(0, 6);
      if (!recent.length) { list.replaceChildren(el("li", { textContent: "No public repos" })); return; }
      const date = new Intl.DateTimeFormat("en-US", { dateStyle: "medium" });
      list.replaceChildren(...recent.map((r) => el("li", {},
        el("a", { href: r.html_url, textContent: r.name, rel: "noopener" }),
        el("span", { className: "meta", textContent: `★ ${fmt.format(r.stargazers_count)} · ${date.format(new Date(r.pushed_at))}` })
      )));
    }

    async function refresh() {
      try {
        const [user, repos] = await Promise.all([getJSON(`${API}/users/${USER}`), getAllRepos()]);
        $("avatar").src = user.avatar_url;
        $("name").textContent = user.name || user.login;
        $("bio").textContent = user.bio || "";
        $("s-repos").textContent = fmt.format(user.public_repos);
        $("s-followers").textContent = fmt.format(user.followers);
        $("s-following").textContent = fmt.format(user.following);
        $("s-gists").textContent = fmt.format(user.public_gists);
        const own = repos.filter((r) => !r.fork);
        $("s-stars").textContent = fmt.format(own.reduce((s, r) => s + r.stargazers_count, 0));
        $("s-forks").textContent = fmt.format(own.reduce((s, r) => s + r.forks_count, 0));
        renderLanguages(own);
        renderRecent(repos);
        $("updated").className = "";
        $("updated").textContent = "last updated: " + new Date().toLocaleTimeString("en-US");
      } catch (err) {
        $("updated").className = "error";
        $("updated").textContent = "Failed to load: " + err.message;
      }
    }

    refresh();
    setInterval(refresh, REFRESH_MS);
  </script>
</body>
</html>
